seed: 42
image_size: 224
batch_size: 32

data:
  manifest: manifest.csv        # relative to DATA_ROOT's parent (the notebook output dir)
  class_names: [meningioma, glioma, pituitary]   # index = raw label - 1
  split: {train: 0.70, val: 0.15, test: 0.15}

model:
  architecture: resnet18
  dropout_p: 0.3

train:
  epochs: 30
  lr: 0.0003

explain:
  methods: [gradcam, integrated_gradients]
  target_layer: layer4

audit:
  deletion_insertion_steps: 20
  stability_transforms:
    - {type: rotate, degrees: 5}
    - {type: rotate, degrees: -5}
    - {type: brightness, factor: 1.10}
  localization_threshold: 0.5

uncertainty:
  n_forward_passes: 30